<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — The Ledger Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div>
      <span class="brand-eyebrow">Est. Locally · Lot by Lot</span>
      <span><span class="brand-mark">The</span> Ledger Room</span>
    </div>
  </div>
  <div id="nav-slot" class="nav-links"></div>
</div>

<div class="page-narrow">
  <div class="card">
    <h2 class="form-title">Create an account</h2>
    <p class="form-sub">Register as a bidder, or as an auctioneer if you hold the admin code.</p>

    <div class="error-msg" id="error-box"></div>

    <div class="role-toggle" id="role-toggle">
      <button type="button" class="active" data-role="user">Bidder</button>
      <button type="button" data-role="admin">Auctioneer (admin)</button>
    </div>

    <form id="register-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <div class="field" id="admin-code-field" style="display:none;">
        <label for="admin_code">Admin signup code</label>
        <input type="password" id="admin_code" placeholder="Provided by the project owner">
      </div>
      <button type="submit" class="btn btn-brass btn-block">Create account</button>
    </form>

    <div class="auth-footer">Already registered? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
