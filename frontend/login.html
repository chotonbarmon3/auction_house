<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — The Ledger Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div>
      <span class="brand-eyebrow">Est. Locally · Lot by Lot</span>
      <span><span class="brand-mark">The</span> Ledger Room</span>
    </div>
  </div>
  <div id="nav-slot" class="nav-links"></div>
</div>

<div class="page-narrow">
  <div class="card">
    <h2 class="form-title">Sign in</h2>
    <p class="form-sub">Enter your credentials to bid or manage your lots.</p>

    <div class="error-msg" id="error-box"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-brass btn-block">Sign in</button>
    </form>

    <div class="auth-footer">New here? <a href="register.html">Create an account</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
